name: NeerNiti Scheduled Data Ingestion Pipeline

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_district:
        description: 'Specific district to refresh (or "all")'
        required: false
        default: 'all'

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ingest India-WRIS Well Telemetry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingestion/fetch_india_wris.py

      - name: Ingest CHIRPS Rainfall
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingestion/fetch_chirps.py

      - name: Ingest GRACE-FO Storage Anomaly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingestion/fetch_grace_fo.py

      - name: Run Verification Re-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/app/ml/run_verification.py
